<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        /* Login Page */

.login-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background-color: #2563eb;
}

.login-box{

    background:white;

    width:400px;

    padding:35px;

    border-radius:15px;

    box-shadow:0 10px 25px rgba(0,0,0,.2);

}

.login-box h1{

    text-align:center;

    color:#2563eb;

    margin-bottom:10px;

}

.subtitle{

    text-align:center;

    color:#666;

    margin-bottom:25px;

}

.input-group{

    margin-bottom:18px;

}

.input-group label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

}

.input-group input{

    width:100%;

    padding:12px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:16px;

}

.input-group input:focus{

    outline:none;

    border-color:#2563eb;

}

button{

    width:100%;

    padding:14px;

    background:#2563eb;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:16px;

    margin-top:15px;

}

button:hover{

    background:#1d4ed8;

}

#message{

    text-align:center;

    margin-top:20px;

    font-weight:bold;

}
    </style>

</head>
<body>

<div class="login-container">

    <div class="login-box">

        <h1>🔐 Login</h1>

        <p class="subtitle">
            Sila masukkan username dan password anda.
        </p>

        <div class="input-group">
            <label>Username</label>
            <input
                type="text"
                id="username"
                placeholder="Masukkan username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Masukkan password">
        </div>

        <button onclick="login()">
            Login
        </button>


        <p id="message"></p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>

<script>
    function login(){

    let username = document.getElementById("username").value;

    let password = document.getElementById("password").value;

    if(username === "admin" && password === "123456"){

        alert("Login Berjaya!");

        window.location.href = "index.html";

    }else{

        document.getElementById("message").innerHTML =
        "❌ Username atau Password Salah";

        document.getElementById("message").style.color = "red";

    }

}
</script>
