<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Saya</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#2563eb,#06b6d4);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:#333;
        }

        .card{
            background:white;
            width:90%;
            max-width:600px;
            padding:40px;
            border-radius:20px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
        }

        .profile{
            width:120px;
            height:120px;
            background:#2563eb;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0 auto 20px;
            font-size:50px;
            color:white;
        }

        h1{
            color:#2563eb;
            margin-bottom:10px;
        }

        .subtitle{
            color:#666;
            margin-bottom:30px;
        }

        .info{
            text-align:left;
            margin-top:20px;
        }

        .info p{
            font-size:18px;
            padding:15px;
            border-bottom:1px solid #ddd;
        }

        button{
            margin-top:30px;
            background:#2563eb;
            color:white;
            border:none;
            padding:14px 28px;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#1d4ed8;
            transform:translateY(-3px);
        }

        @media(max-width:768px){

            .card{
                padding:30px;
            }

            .info p{
                font-size:16px;
            }

        }

    </style>

</head>

<body>

<div class="card">

    <div class="profile">
        👤
    </div>

    <h1>Khaliq Kamarul</h1>

    <p class="subtitle">
         Web Developer
    </p>

    <div class="info">

        <p><strong>📛 Name:</strong> Khaliq Kamarul</p>

        <p><strong>📞 Contact:</strong> +60 12-345 6789</p>

        <p><strong>📧 Email:</strong> khaliq@example.com</p>

    </div>

    <button onclick="showMessage()">
        Contact Me
    </button>

</div>

<script>

function showMessage(){

    alert("Terima kasih kerana melawat portfolio saya!");

}

</script>

</body>
</html>
